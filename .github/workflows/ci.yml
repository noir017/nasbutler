name: CI

# 编译 + 测试。分支推送与 PR 自动触发。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: 编译与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          # 从 go.mod 读取版本，避免这里和 go.mod 各说各话。
          go-version-file: go.mod
          cache: true

      - name: 检查格式 (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请运行 gofmt -w ："
            echo "$unformatted"
            exit 1
          fi

      - name: 校验依赖完整性
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: 构建静态单文件
        run: VERSION="ci-${GITHUB_SHA::7}" ./build.sh dist/nasbutler

      - name: 运行测试（含竞态检测）
        # 竞态检测需要 cgo；发布用 CGO_ENABLED=0，二者互不影响。
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
