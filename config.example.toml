# nasbutler 配置示例。复制为 config.toml 后按需修改。
# 规则写法同 .gitignore：不带斜杠的模式匹配任意深度（"*.kdbx"），开头的斜杠锚定到根
#（"/backup"），结尾的 "/**" 可省略。匹配不区分大小写。匹配到目录即覆盖其下全部内容。

# 要整理的根目录。nasbutler 只读访问它，从不写入。
root = "/srv/archive"

# 状态目录：索引库、化名密钥、审计日志。不能和 root 互相包含。
state_dir = "/var/lib/nasbutler"

[rules]
# 完全不可见：不扫描、不计数，agent 连它存在都不知道。
hidden = [
  # "/private",
]

# 只计总数和总大小，不列文件、不读内容。适合备份区这类"别碰也别看"的目录。
opaque = [
  # "/backup",
]

# 追加的机密规则（内置规则始终生效，见 internal/rules/builtin.go）。
# 机密文件的名字整体换成化名，内容不读，也不能进整理计划。
secret = [
  # "病历",
  # "/work/hr",
]

# 受保护：看得见，但任何计划都不能以它为源或目标。opaque 目录自动受保护。
protected = [
  # "/archive/final",
]

[scan]
# 文本类文件读开头多少字节做敏感检测。
max_content_bytes = 1048576
# 扫描后找重复文件（大小相同 → 首尾各 64 KiB 哈希 → 全文件哈希）。
hash = true
# 小于这个字节数的文件不参与去重。
hash_min_size = 1

[serve]
# HTTP 监听地址，MCP 端点是 /mcp。别直接监听公网。
listen = "127.0.0.1:8765"
# bearer token 文件（必须 chmod 600，至少 24 个字符）。环境变量 NASBUTLER_TOKEN 优先。
token_file = ""
# 单次工具返回的字节上限，超过就拒绝，防止批量导出。
max_result_bytes = 65536
# 单次最多返回多少条。
max_limit = 200
# 媒体探测用的 ffprobe；设为 "" 关闭。
ffprobe = "ffprobe"

[plans]
# MCP 服务写计划草稿和提交的目录（服务端唯一可写的地方）。默认 <state_dir>/plans。
dir = ""
# 单个计划最多多少项操作。
max_ops = 5000

[exec]
# 执行器自己的状态目录：审批记录、操作日志（含真实路径）。MCP 服务不能写它。默认 <state_dir>/exec。
dir = ""
# 隔离区，必须和 root 在同一个文件系统上（移动靠 rename，从不复制）。
# 默认 <root>/.nasbutler/quarantine；.nasbutler 始终对扫描隐藏。
quarantine_dir = ""
# 审批方式："feishu"（卡片按钮）或 "local"（在本机运行 nasbutler plan approve）。
approver = "feishu"
# 审批请求多久过期。
approval_ttl = "24h"
# 执行完做一次增量重扫，让 agent 马上看到新结构。
rescan = true

[feishu]
# 应用凭据。app secret 放在 chmod 600 的文件里；环境变量 NASBUTLER_FEISHU_APP_SECRET 优先。
app_id = ""
app_secret_file = ""
# 审批人的 open_id（每个应用不同）。用 `nasbutler feishu test -email 你的邮箱` 点一下测试卡片就能拿到。
approver_open_id = ""
# 国际版 Lark 用 https://open.larksuite.com
base_url = "https://open.feishu.cn"
